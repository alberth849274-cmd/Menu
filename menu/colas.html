<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Colas</title>

  <!-- ======== ESTILO COMIC ======== -->
  <style>
    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: #fffae6;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 40px;
      color: #33cc33;
      text-shadow: 3px 3px 0px black;
      font-weight: bold;
    }

    .btn {
      background: #ffcc00;
      border: 4px solid black;
      padding: 12px 25px;
      margin: 10px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 4px 4px 0px black;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 6px 6px 0px black;
    }

    #resultado {
      margin-top: 25px;
      font-size: 24px;
      background: #ffffff;
      padding: 20px;
      display: inline-block;
      border: 4px solid black;
      border-radius: 10px;
      box-shadow: 4px 4px 0px black;
      min-width: 200px;
    }

    .link-menu {
      display: inline-block;
      margin-top: 30px;
      font-size: 22px;
      background: #66ccff;
      color: black;
      padding: 10px 20px;
      border: 4px solid black;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 4px 4px 0px black;
    }

    .link-menu:hover {
      transform: scale(1.05);
      box-shadow: 6px 6px 0px black;
    }
  </style>

  <!-- ======== JavaScript ======== -->
  <script>
    let cola = [];

    function enqueue() {
      let elemento = prompt("Ingresa un elemento para encolar:");
      if (elemento) cola.push(elemento);
      mostrarCola();
    }

    function dequeue() {
      if (cola.length > 0) {
        alert("Elemento desencolado: " + cola.shift());
      } else {
        alert("La cola está vacía.");
      }
      mostrarCola();
    }

    function mostrarCola() {
      document.getElementById("resultado").innerHTML =
        "Cola: [" + cola.join(", ") + "]";
    }
  </script>
</head>

<body>
  <h1>Ejemplo de Cola (Queue)</h1>

  <button class="btn" onclick="enqueue()">Encolar (Enqueue)</button>
  <button class="btn" onclick="dequeue()">Desencolar (Dequeue)</button>

  <p id="resultado">Cola: []</p>

  <a class="link-menu" href="menu.html">Volver al Menú</a>
</body>
</html>
