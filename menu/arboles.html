<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Árboles</title>

  <!-- ======== ESTILO COMIC ======== -->
  <style>
    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: #fffae6;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 40px;
      color: #0099ff;
      text-shadow: 3px 3px 0px black;
      font-weight: bold;
    }

    .btn {
      background: #ffcc00;
      border: 4px solid black;
      padding: 12px 25px;
      margin: 10px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 4px 4px 0px black;
      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.08);
      box-shadow: 6px 6px 0px black;
    }

    #resultado {
      margin-top: 25px;
      font-size: 24px;
      background: #ffffff;
      padding: 20px;
      display: inline-block;
      border: 4px solid black;
      border-radius: 10px;
      box-shadow: 4px 4px 0px black;
      min-width: 200px;
      text-align: left;
    }

    .link-menu {
      display: inline-block;
      margin-top: 30px;
      font-size: 22px;
      background: #66ccff;
      color: black;
      padding: 10px 20px;
      border: 4px solid black;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 4px 4px 0px black;
    }

    .link-menu:hover {
      transform: scale(1.05);
      box-shadow: 6px 6px 0px black;
    }
  </style>

  <!-- ======== JavaScript ======== -->
  <script>
    class Nodo {
      constructor(valor) {
        this.valor = valor;
        this.hijos = [];
      }
    }

    let raiz = null;

    function agregarNodo() {
      let valor = prompt("Valor del nodo:");
      if (!valor) return;

      if (raiz === null) {
        raiz = new Nodo(valor);
        alert("Nodo raíz creado.");
      } else {
        let padre = prompt("Ingresa el valor del nodo padre:");
        let nodoPadre = buscarNodo(raiz, padre);

        if (nodoPadre) {
          nodoPadre.hijos.push(new Nodo(valor));
          alert("Nodo agregado como hijo de " + padre);
        } else {
          alert("No se encontró el nodo padre.");
        }
      }
      mostrarArbol();
    }

    function buscarNodo(nodo, valor) {
      if (nodo.valor === valor) return nodo;

      for (let hijo of nodo.hijos) {
        let encontrado = buscarNodo(hijo, valor);
        if (encontrado) return encontrado;
      }

      return null;
    }

    function mostrarArbol() {
      document.getElementById("resultado").innerHTML =
        raiz ? generarLista(raiz) : "Árbol vacío";
    }

    function generarLista(nodo) {
      let html = "<ul><li>" + nodo.valor;

      if (nodo.hijos.length > 0) {
        html += "<ul>";
        for (let hijo of nodo.hijos) {
          html += generarLista(hijo);
        }
        html += "</ul>";
      }

      html += "</li></ul>";
      return html;
    }
  </script>
</head>

<body>
  <h1>Ejemplo de Árbol</h1>

  <button class="btn" onclick="agregarNodo()">Agregar Nodo</button>

  <div id="resultado">Árbol vacío</div>

  <a class="link-menu" href="menu.html">Volver al Menú</a>
</body>
</html>
